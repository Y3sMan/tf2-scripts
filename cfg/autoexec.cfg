
// TF2 Scripts v1.2
// Provides utility scripts for all TF2 classes.

// Create an empty alias, to "unbind" aliases.
alias empty ""

exec _default.cfg
exec _lang.cfg
exec _reset.cfg
exec tweaks/_master.cfg

// reset security server command
sv_allow_point_servercommand official

// map specific commands, usually launch commands
exec maps/_master.cfg
