
exec _global_binds.cfg





alias zoom_fov empty
alias ZOOM_OUT_SENSITIVITY "sensitivity 2.0"
ZOOM_OUT_SENSITIVITY

min_viewmodels_on


// main wpn binds
alias rocketlauncher slot1
alias shotty slot2
alias shovel slot3

alias +rocketlauncher_attack "rocketlauncher; +attack"
alias -rocketlauncher_attack "; -attack"

alias +shotty_attack " shotty; +attack"
alias -shotty_attack  -attack"

alias +shovel_attack "shovel; +attack"
alias -shovel_attack " -attack"
//
bind mouse1 +rocketlauncher_attack // left mouse btn
bind mouse2 +shotty_attack // right mouse btn
bind mouse3 +shovel_attack // middle mouse button

