

exec _reset.cfg

// Set sensitivity alias for the zoom script
//alias ZOOM_OUT_SENSITIVITY "sensitivity 3.0"
// also apply it at start 

alias zoom_fov empty

alias ZOOM_OUT_SENSITIVITY "sensitivity 1.75"
ZOOM_OUT_SENSITIVITY


// main wpn binds
alias shotty slot1
alias pistol slot2
alias bat slot3

alias +shotty_attack "shotty; +attack"
alias -shotty_attack "; -attack"

alias +pistol_attack " pistol; +attack"
alias -pistol_attack  -attack"

alias +bat_attack "bat; +attack"
alias -bat_attack " -attack"

bind mouse1 +shotty_attack // left mouse btn
bind mouse2 +pistol_attack // right mouse btn
bind mouse4 +bat_attack 


// special attack
bind mouse5 +attack2
