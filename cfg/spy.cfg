
exec _global_binds.cfg




// Crosshair
//dotXHair
xhair_improved1
alias xhair_scale "cl_crosshair_scale 1200;"

min_viewmodels_on
// set custom viewmodel fov for spy
alias nonmin_viewmodel_fov "viewmodel_fov 90; viewmodel_fov_demo 90;" 
alias min_viewmodel_fov "viewmodel_fov 90; viewmodel_fov_demo 90"
//alias DESIRED_MODEL_FOV nonmin_viewmodel_fov

//alias min_viewmodel_fov "viewmodel_fov 120; viewmodel_fov_demo 90"
DESIRED_MODEL_FOV


alias ZOOM_IN_FOV "fov_desired 10;"
alias ZOOM_IN_SENSITIVITY "sensitivity .50"


// Toggle 3d Player Class Model
// bind to R-layer hold
alias +3d_player_model_toggle "3d_player_model_on"
alias -3d_player_model_toggle "3d_player_model_off"


// use 2d player class image by default
3d_player_model_off

// Reload key
bind G "+reload"
// Auto Reload toggle






// Auto sap /////////////////////////////////////////////////////////////////////
alias +auto_sap "slot2; +attack;"
alias -auto_sap "-attack; lastinv;"

bind mouse5 +auto_sap

// weapon slot specific stuff
//alias gun_sensitivity "sensitivity 2"
//alias knife_sensitivity "sensitivity 2"
alias gun_sensitivity  ZOOM_OUT_SENSITIVITY//"alias ZOOM_OUT_SENSITIVITY sensitivity 1.25; ZOOM_OUT_SENSITIVITY"
alias knife_sensitivity ZOOM_OUT_SENSITIVITY//"alias ZOOM_OUT_SENSITIVITY sensitivity 2.5; ZOOM_OUT_SENSITIVITY"
alias sap_sensitivity knife_sensitivity 
ZOOM_OUT_SENSITIVITY

alias knife_xhair_scale xhair_scale 
alias gun_xhair_scale xhair_scale 
alias sap_xhair_scale  xhair_scale

alias knife "knife_sensitivity; slot3; knife_xhair_scale" ;
alias pistol "gun_sensitivity;  slot1; gun_xhair_scale";
alias sap "sap_sensitivity; slot2;sap_xhair_scale"; 


// main weapon binds
bind MWHEELUP knife
bind MWHEELDOWN pistol
bind F sap
// set lastdisguise key to r



// R layer Key
alias +spy_layer_R " +3d_player_model_toggle; lastdisguise "
alias -spy_layer_R " -3d_player_model_toggle; "
bind R "+spy_layer_R"

//bind Shift +reload


// concise disguise for 1-3 keys //////////////////////////////////////////////////////////////////////
// pulled from https://www.reddit.com/r/Tf2Scripts/comments/42tps9/emulate_concise_spy_disguise_menu_with_binds/
bind 1 funct_1
bind 2 funct_2
bind 3 funct_3
bind 4 return

bind mouse3 f_spy // Undisguise button

// spy_mouse4_layer is the aggrogate alias for this modifier key



alias +spy_mouse4_layer "+mouse4_layer; +c_disg_t; +3d_player_model_toggle; "
alias -spy_mouse4_layer "-mouse4_layer; -c_disg_t; -3d_player_model_toggle; "
bind mouse4 "+spy_mouse4_layer"

alias e_scout		"disguise 1 -1;return;play vo/scout_yes01.mp3"
alias e_soldier		"disguise 3 -1;return;play vo/soldier_yes03.mp3"
alias e_pyro		"disguise 7 -1;return;play vo/pyro_yes01.mp3"
alias e_demoman		"disguise 4 -1;return;play vo/demoman_yes02.mp3"
alias e_heavy		"disguise 6 -1;return;play vo/heavy_yes02.mp3"
alias e_engineer	"disguise 9 -1;return;play vo/engineer_yes03.mp3"
alias e_medic		"disguise 5 -1;return;play vo/medic_yes03.mp3"
alias e_sniper		"disguise 2 -1;return;play vo/sniper_yes01.mp3"
alias e_spy			"disguise 8 -1;return;;play vo/spy_yes02.mp3"

alias f_scout		"disguise 1 -2;return;play vo/scout_no02.mp3"
alias f_soldier		"disguise 3 -2;return;play vo/soldier_no02.mp3"
alias f_pyro		"disguise 7 -2;return;play vo/pyro_no01.mp3"
alias f_demoman		"disguise 4 -2;return;play vo/demoman_no01.mp3"
alias f_heavy		"disguise 6 -2;return;play vo/heavy_no02.mp3"
alias f_engineer	"disguise 9 -2;return;play vo/engineer_no01.mp3"
alias f_medic		"disguise 5 -2;return;play vo/medic_no01.mp3"
alias f_sniper		"disguise 2 -2;return;play vo/sniper_no01.mp3"
alias f_spy			"disguise 8 -2;return;play tvo/spy_no02.mp3"

alias +c_disg_t "alias funct_1 f_concise_1;alias funct_2 f_concise_2;alias funct_3 f_concise_3;alias return +c_disg_t"
alias -c_disg_t "alias funct_1 e_concise_1;alias funct_2 e_concise_2;alias funct_3 e_concise_3;alias return -c_disg_t"

// class group 1
alias f_concise_1 "alias funct_1 f_scout	;alias funct_2 f_soldier;alias funct_3 f_pyro"
// class group 2
alias f_concise_2 "alias funct_1 f_demoman	;alias funct_2 f_heavy	;alias funct_3 f_engineer"
// class group 3
alias f_concise_3 "alias funct_1 f_medic	;alias funct_2 f_sniper	;alias funct_3 f_spy"

// class group 1
alias e_concise_1 "alias funct_1 e_scout	;alias funct_2 e_soldier;alias funct_3 e_pyro"
// class group 2
alias e_concise_2 "alias funct_1 e_demoman	;alias funct_2 e_heavy	;alias funct_3 e_engineer"
// class group 3
alias e_concise_3 "alias funct_1 e_medic	;alias funct_2 e_sniper	;alias funct_3 e_spy"
