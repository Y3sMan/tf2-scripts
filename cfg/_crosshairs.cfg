// File to store custom settings for different crosshairs

// improved crosshairs

// Scale
// based on default and preferences
alias baseXHairScale "cl_crosshair_scale 40;"

// setting crosshairs will change
alias xhair_scale "baseXHairScale;"

alias reset_xhair_scale "alias xhair_scale baseXHairScale; xhair_scale"


// custom crosshairs
alias xhair_scale_improved "cl_crosshair_scale 1200"
alias xhair_scale_dyslexic "cl_crosshair_scale 350"

alias xhair_improved1 "cl_crosshair_file crosshair1_improved; alias xhair_scale xhair_scale_improved; xhair_scale "
alias xhair_dyslexic_revolver "cl_crosshair_file dyslexic_xhair_smgrevolver; alias xhair_scale xhair_scale_dyslexic; xhair_scale"


// ////////////Crosshair////////////////


// vanilla crosshairs
alias xhair_none "cl_crosshair_file ‘’;"
alias xhair_default "xhair_none; reset_xhair_scale"// alias baseXHairScale cl_crosshair_scale 40"
alias xhair_vanilla_circle "cl_crosshair_file crosshair3; reset_xhair_scale"
alias xhair_vanilla_dot "cl_crosshair_file crosshair5; reset_xhair_scale"

// Base crosshair settings
xhair_default