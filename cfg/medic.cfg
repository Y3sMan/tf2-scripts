unbind 1
bind 2 +change_to_expl
bind 3 +change_to_fire
bind 4 reset

alias unbind_vaccs "unbind 1; unbind 2; unbind 3; unbind 4"
alias bind_vaccs "unbind 1; bind 2 +change_to_expl; bind 3 +change_to_fire;"

alias reset "exec medic.cfg"

alias current_slot current_slot_bullet
current_slot_bullet

// moving one slot over, we change that move_X to empty
// there is a built-in *move_once* already
// the move_X determines if we should move one more slot again, on key-release
alias current_slot_bullet "unbind 1; alias move_bullet empty; alias move_expl empty; alias move_fire move_once"
alias current_slot_expl "unbind 2; alias move_expl empty; alias move_fire empty;  alias move_bullet move_once"
alias current_slot_fire "unbind 3; alias move_fire empty; alias move_bullet empty; alias move_expl move_once"



alias move_once "+reload 1; -reload 1"
alias move_twice "move_once; move_next;"


// default assumes current slot is bullet
alias move_bullet empty
alias +change_to_bullet "unbind 2; unbind 3; move_once"
alias -change_to_bullet "bind 2 +change_to_expl; bind 3 +change_to_fire;move_bullet; current_slot_bullet"

alias move_expl empty 
alias +change_to_expl "unbind 1; unbind 3; move_once"
alias -change_to_expl "bind 1 +change_to_bullet; bind 3 +change_to_fire; move_expl; current_slot_expl"

alias move_fire move_once 
alias +change_to_fire "unbind 1; unbind 2; move_once"
alias -change_to_fire "bind 1 +change_to_bullet; bind 2 +change_to_expl;move_fire; current_slot_fire"